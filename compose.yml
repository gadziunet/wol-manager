services:
  wol:
    build: .
    container_name: wol
    restart: unless-stopped
    # Required: broadcast packets must leave through the real network interfaces.
    network_mode: host
    read_only: true
    # Root only at startup: the app hands /data to user 65532 and switches to it.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    environment:
      WOL_ADDR: ":8080"
      # Behind an HTTPS reverse proxy, also set:
      # WOL_COOKIE_SECURE: "true"
      # WOL_TRUST_PROXY: "true"
    volumes:
      - wol-data:/data

volumes:
  wol-data:
